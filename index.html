<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="MealMaster Pro - High-End Meal Management Dashboard for Shared Housing">
    <meta name="theme-color" content="#1e1b4b">
    <title>MealMaster Pro - High-End Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-soft-grey: #f8fafc;
            --text-navy: #1e1b4b;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-soft-grey);
            color: var(--text-navy);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(30, 41, 59, 0.7); border-color: rgba(51, 65, 85, 0.5); }
        
        /* Custom scrollbar for high-end feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(15%) sepia(50%) saturate(5000%) hue-rotate(220deg) brightness(90%) contrast(90%);
        }
        .dark input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(90%);
        }
        
        /* Smooth Entrance Animation Classes */
        .fade-in-fast {
            animation: fadeInFast 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInFast {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .premium-border {
            position: relative;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
        }

        /* Hover states for premium elements */
        .premium-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.1), 0 10px 10px -5px rgba(99, 102, 241, 0.04);
        }
        
        .dark input, .dark select {
            color-scheme: dark;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.17"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
